services:
  - type: web
    name: pocketsmart-ai
    runtime: node
    buildCommand: cd "Back end" && npm install
    startCommand: cd "Back end" && npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
